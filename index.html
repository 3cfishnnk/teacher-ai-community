<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 資訊與思考力社群｜教師專業社群活動紀錄</title>
<meta name="description" content="校內教師專業社群「AI 資訊與思考力社群」活動紀錄首頁，彙整每次聚會的紀錄、簡報與範例檔案。">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <p class="eyebrow">教師專業社群</p>
      <h1>AI 資訊與思考力社群</h1>
      <p class="lede">用 AI 幫自己減輕重複性工作，但思考不能外包。這裡彙整每次社群聚會的活動紀錄、簡報與範例檔案，方便社群夥伴隨時回顧與延伸應用。</p>
    </div>
  </header>

  <main class="wrap">
    <section aria-labelledby="records-heading">
      <div class="section-head">
        <h2 id="records-heading">活動紀錄</h2>
        <p class="section-sub">共 <span id="record-count">0</span> 場聚會，最新的排在最上面</p>
      </div>

      <div id="records-list" class="records-list">
        <!-- 卡片由 js/main.js 依 js/records.js 的資料動態產生 -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>AI 資訊與思考力社群</p>
    </div>
  </footer>

  <script src="js/records.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
